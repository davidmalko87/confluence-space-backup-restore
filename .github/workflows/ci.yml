name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-check:
    name: Lint & smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff<0.16" pytest  # 0.16 changed the default rule set

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Verify package imports
        run: |
          python -c "from confluence_tool import __version__; print('version:', __version__)"
          python -c "from confluence_tool.backup import BackupManager"
          python -c "from confluence_tool.restore import RestoreManager"
          python -c "from confluence_tool.api_client import ConfluenceClient"
          python -c "from confluence_tool.menu import run_menu"

      - name: Verify entry point loads
        run: python main.py --help || true

  package:
    name: Build, check and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/confluence-backup --help
